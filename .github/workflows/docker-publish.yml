name: Publicar Docker en GHCR

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar y ejecutar pruebas automatizadas
        run: dotnet test ./Backend/ControlReactor.Tests/ControlReactor.Tests.csproj --logger "trx;LogFileName=resultados.trx" --results-directory ./resultados-pruebas

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: ./resultados-pruebas

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ghcr.io/ronaldmr22/control-reactor-api:latest
