<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - Control del Reactor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: Arial, sans-serif;
            color: white;
        }

        .tarjeta {
            width: 100%;
            max-width: 440px;
            padding: 40px 30px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .icono {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 20px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
            font-size: 16px;
        }

        .instruccion {
            margin-top: 25px;
            padding: 15px;
            background: #334155;
            border-radius: 10px;
        }

        .nombre-juego {
            margin-top: 30px;
            color: #38bdf8;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="tarjeta">
        <div class="icono">⚠️</div>

        <h1>Este correo ya está registrado</h1>

        <p>
            Ya existe una cuenta de Control del Reactor
            asociada a este correo electrónico.
        </p>

        <div class="instruccion">
            <p>
                Regresa al juego e inicia sesión
                con tu correo y contraseña.
            </p>
        </div>

        <p>Puedes cerrar esta pestaña.</p>

        <div class="nombre-juego">
            CONTROL DEL REACTOR
        </div>
    </main>
</body>
</html>
